[package]
name = "bevy_vulkan_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { version = "0.38.0", features = ["linked"] }
vk-mem = "0.4.0"
vk-shader-macros = "0.2.10"
raw-window-handle = "0.6"

ash-window = "0.13.0"
winit = "0.30"

glam = "0.30.2"
rand = "0.9.1"

[dependencies.bevy]
version = "0.16.0"
features = [
    "std",
    "bevy_winit"
]
default-features = false
